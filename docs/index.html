<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>All About Melina</title>
<style>
  :root {
    --paper: #f7f3ea;
    --ink: #1c1917;
    --muted: #6b645b;
    --line: #2a2724;
    --cell-bg: #fffdf8;
    --word: #f3e2a0;
    --sel: #e8b84a;
    --wrong-bg: #f8d4d0;
    --wrong: #9b1c1c;
    --wine: #7a2e3a;
    --wine-dark: #5c222b;
    --bar: #1c1917;
    --ok: #2f6b3a;
    --shadow: 0 1px 2px rgba(28,25,23,.06), 0 8px 24px rgba(28,25,23,.06);
    --ui: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Palatino Linotype", Palatino, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--ui);
    background: var(--paper);
    color: var(--ink);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  body.locked { overflow: hidden; }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 16px 48px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  header.page-head { text-align: center; margin: 4px 0 12px; }
  header.page-head h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.5rem, 4vw, 2.15rem);
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    line-height: 1.15;
  }
  header.page-head .sub {
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    margin: 0;
    font-size: 1.02rem;
  }
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin: 0 0 12px;
  }
  .tools button, .tools summary {
    appearance: none;
    font: 600 13px/1 var(--ui);
    border: 1px solid #cfc6b6;
    background: #fff;
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(28,25,23,.04);
  }
  .tools button:hover, .tools summary:hover { border-color: #a89f90; background: #fff; }
  .tools button:active, .tools summary:active { transform: translateY(1px); }
  #btn-check {
    background: var(--wine);
    color: #fff;
    border-color: var(--wine-dark);
  }
  #btn-check:hover { background: var(--wine-dark); }
  .tools .progress {
    font-size: 12px;
    color: var(--muted);
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .tools .progress.done { color: var(--ok); font-weight: 700; }
  .menu { position: relative; }
  .menu summary { list-style: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary::after { content: " ▾"; font-size: 10px; opacity: .7; }
  .menu .panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: #fff;
    border: 1px solid #ddd4c6;
    border-radius: 10px;
    min-width: 132px;
    box-shadow: var(--shadow);
    z-index: 40;
    overflow: hidden;
    padding: 4px;
  }
  .menu .panel button {
    display: block;
    width: 100%;
    border: 0;
    box-shadow: none;
    border-radius: 8px;
    text-align: left;
    padding: 8px 10px;
  }
  .menu .panel button:hover { background: #f3eee4; }

  .clue-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: stretch;
    gap: 0;
    background: var(--bar);
    color: #fff;
    border-radius: 10px;
    overflow: hidden;
    min-height: 52px;
    box-shadow: 0 6px 16px rgba(28,25,23,.12);
    margin-bottom: 12px;
  }
  #btn-dir {
    flex: 0 0 auto;
    border: 0;
    background: #2d2926;
    color: #f3e2a0;
    font: 800 11px/1.1 var(--ui);
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 8px 12px;
    min-width: 64px;
    cursor: pointer;
  }
  #btn-dir:hover { background: #3a3531; }
  .clue-bar .clue-copy {
    flex: 1;
    padding: 8px 12px;
    font-size: 14px;
    line-height: 1.35;
    display: flex;
    align-items: center;
  }
  .clue-bar .clue-copy b { margin-right: 8px; font-variant-numeric: tabular-nums; }

  .play { display: block; }
  .board-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
    margin: 0 auto 18px;
  }
  .board {
    --cell: min(40px, calc((100vw - 32px) / var(--cols)));
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    grid-template-rows: repeat(var(--rows), var(--cell));
    user-select: none;
    -webkit-user-select: none;
  }
  .grid-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    pointer-events: none;
    z-index: 2;
    overflow: visible;
  }
  .grid-lines path {
    fill: none;
    stroke: var(--line);
    stroke-width: 1px;
    stroke-linecap: square;
    stroke-linejoin: miter;
    vector-effect: non-scaling-stroke;
  }
  .cell {
    position: relative;
    background: transparent;
    pointer-events: none;
  }
  .cell.open {
    background: var(--cell-bg);
    pointer-events: auto;
    cursor: pointer;
    touch-action: manipulation;
  }
  .cell.open.black { background: #111; }
  .cell .num {
    position: absolute;
    top: 0px;
    left: 1px;
    font-size: max(9px, calc(var(--cell) * 0.32));
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    pointer-events: none;
    z-index: 1;
  }
  .cell .glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-weight: 750;
    font-size: max(12px, calc(var(--cell) * 0.52));
    letter-spacing: 0;
    padding-top: 8%;
    pointer-events: none;
    text-transform: uppercase;
  }
  .cell.in-word { background: var(--word); }
  .cell.selected { background: var(--sel); z-index: 1; outline: 2px solid var(--ink); outline-offset: -2px; }
  .cell.wrong { background: var(--wrong-bg); color: var(--wrong); }
  .cell.wrong.in-word { background: #f1c4a8; }
  .cell.wrong.selected { background: #e8b84a; }

  .clues {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 32px;
  }
  .clues h2 {
    font-family: var(--serif);
    font-size: 1.05rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin: 0 0 8px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--ink);
  }
  .clues ol { list-style: none; margin: 0; padding: 0; }
  .clues li {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 6px;
    padding: 5px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.35;
  }
  .clues li:hover { background: #ece5d6; }
  .clues li.active { background: var(--word); }
  .clues li .n { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .clues li.filled .t { opacity: .55; text-decoration: line-through; text-decoration-thickness: 1px; }

  #kb {
    position: fixed;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    font-size: 16px;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    z-index: 50;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(28,25,23,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal .card {
    background: var(--paper);
    color: var(--ink);
    max-width: 420px;
    width: 100%;
    border-radius: 16px;
    padding: 32px 28px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(28,25,23,.28);
  }
  .modal .heart { color: var(--wine); font-size: 28px; margin-bottom: 8px; }
  .modal h2 {
    font-family: var(--serif);
    font-size: 1.8rem;
    margin: 0 0 8px;
  }
  .modal p { margin: 0 0 18px; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1.05rem; }
  .modal button {
    appearance: none;
    border: 0;
    background: var(--wine);
    color: #fff;
    font: 600 14px var(--ui);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  @media (min-width: 900px) {
    .wrap { padding-top: 28px; }
    .play {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 28px;
      align-items: start;
    }
    .board-wrap { margin-bottom: 0; }
    .board { --cell: min(38px, calc((48vw - 48px) / var(--cols)), calc((100dvh - 200px) / var(--rows))); }
  }
  @media (max-width: 640px) {
    .wrap { padding: 10px 10px 40px; }
    header.page-head { margin-bottom: 8px; }
    .clues { grid-template-columns: 1fr; gap: 16px; }
    .board { --cell: min(28px, calc((100vw - 20px) / var(--cols))); }
    .tools button, .tools summary { padding: 7px 10px; font-size: 12px; }
  }

  @media print {
    @page { margin: 0.5in; size: letter; }
    body { background: #fff !important; }
    .tools, .clue-bar, #kb, .modal, #btn-dir { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    header.page-head { margin-bottom: 16px; }
    .cell .glyph { display: none !important; }
    .cell.in-word, .cell.selected, .cell.wrong { background: #fff !important; color: #000 !important; box-shadow: none !important; outline: none !important; }
    .grid-lines path { stroke: #000; stroke-width: 0.8pt; }
    .clues li.active, .clues li:hover { background: transparent !important; }
    .clues li.filled .t { opacity: 1; text-decoration: none !important; }
    .play { display: block !important; }
    .board-wrap { margin-bottom: 22px; }
    .board { --cell: min(28px, calc((100vw - 1in) / var(--cols))); break-inside: avoid; }
    .clues { break-inside: avoid; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </header>
    <div class="tools">
      <button type="button" id="btn-check">Check</button>
      <details class="menu" id="menu-reveal">
        <summary>Reveal</summary>
        <div class="panel">
          <button type="button" id="btn-reveal-letter">Letter</button>
          <button type="button" id="btn-reveal-word">Word</button>
          <button type="button" id="btn-reveal-puzzle">Puzzle</button>
        </div>
      </details>
      <details class="menu" id="menu-clear">
        <summary>Clear</summary>
        <div class="panel">
          <button type="button" id="btn-clear-word">Word</button>
          <button type="button" id="btn-clear-puzzle">Puzzle</button>
        </div>
      </details>
      <button type="button" id="btn-print">Print</button>
      <span class="progress" id="progress"></span>
    </div>
    <div class="clue-bar" id="clue-bar">
      <button type="button" id="btn-dir" aria-label="Switch direction">Across</button>
      <div class="clue-copy" id="clue-copy">Tap a square to begin.</div>
    </div>
    <div class="play">
      <div class="board-wrap">
        <div class="board" id="board" aria-label="Crossword grid"></div>
      </div>
      <div class="clues" id="clues"></div>
    </div>
  </div>

  <input id="kb" type="text" inputmode="text" autocomplete="off" autocorrect="off"
    autocapitalize="characters" spellcheck="false" maxlength="1" aria-label="Type a letter">

  <div class="modal" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="card">
      <div class="heart">♥</div>
      <h2 id="win-title">You solved it!</h2>
      <p id="win-msg"></p>
      <button type="button" id="win-close">Close</button>
    </div>
  </div>

<script>
const P = {"title":"All About Melina","subtitle":"Love, Finn","rows":17,"cols":15,"black":false,"open":[[false,false,false,true,false,false,false,false,false,false,false,false,false,false,false],[false,true,true,true,true,true,true,false,false,false,false,false,false,true,false],[false,false,false,true,false,true,false,false,false,false,false,false,false,true,false],[false,false,false,true,true,true,true,true,true,true,true,false,false,true,false],[false,false,false,true,false,true,false,false,false,false,false,false,false,true,false],[false,false,false,true,false,true,false,false,false,false,false,false,false,true,false],[true,true,true,true,true,true,true,true,false,false,false,false,false,true,false],[false,false,false,true,false,true,false,false,false,false,true,false,false,true,false],[false,false,false,true,true,true,true,true,true,true,true,true,true,true,true],[false,false,false,false,false,true,false,true,false,false,true,false,false,true,false],[false,true,false,false,true,false,false,true,false,true,true,true,true,true,true],[false,true,true,true,true,true,true,true,false,false,true,false,true,false,false],[false,true,false,false,true,false,false,true,false,false,true,false,true,false,false],[false,true,false,false,true,false,true,true,true,true,true,true,true,true,true],[false,true,false,false,false,false,false,true,false,false,true,false,true,false,false],[false,true,false,false,false,false,false,true,false,false,false,false,true,false,false],[false,true,false,false,false,false,false,false,false,false,false,false,false,false,false]],"nums":{"0,3":1,"1,1":2,"1,5":3,"1,13":4,"3,3":5,"6,0":6,"7,10":7,"8,3":8,"8,7":9,"10,1":10,"10,4":11,"10,9":12,"10,12":13,"11,1":14,"13,6":15},"words":[{"id":"A2","dir":"across","num":2,"clue":"Gummy brand in Melina's sweet tooth puzzle (6)","cells":[[1,1],[1,2],[1,3],[1,4],[1,5],[1,6]],"a":"SEFSSUJP"},{"id":"A5","dir":"across","num":5,"clue":"Seafood from the dinner date puzzle (8)","cells":[[3,3],[3,4],[3,5],[3,6],[3,7],[3,8],[3,9],[3,10]],"a":"U0NBTExPUFM="},{"id":"A6","dir":"across","num":6,"clue":"Chewy candy from Melina's sweet tooth (8)","cells":[[6,0],[6,1],[6,2],[6,3],[6,4],[6,5],[6,6],[6,7]],"a":"TElDT1JJQ0U="},{"id":"A8","dir":"across","num":8,"clue":"In-N-Out order that's the spangram of 'Order like Melina' (6,6)","cells":[[8,3],[8,4],[8,5],[8,6],[8,7],[8,8],[8,9],[8,10],[8,11],[8,12],[8,13],[8,14]],"a":"RE9VQkxFRE9VQkxF"},{"id":"A12","dir":"across","num":12,"clue":"The 'I love _____' at the heart of the first Strands puzzle (6)","cells":[[10,9],[10,10],[10,11],[10,12],[10,13],[10,14]],"a":"TUVMSU5B"},{"id":"A14","dir":"across","num":14,"clue":"Iced drink on the 'Sip sip hooray!' list (4,3)","cells":[[11,1],[11,2],[11,3],[11,4],[11,5],[11,6],[11,7]],"a":"VEhBSVRFQQ=="},{"id":"A15","dir":"across","num":15,"clue":"Shot from 'Sip sip hooray!,' promised with lavender vanilla lattes (5,4)","cells":[[13,6],[13,7],[13,8],[13,9],[13,10],[13,11],[13,12],[13,13],[13,14]],"a":"SkFHRVJCT01C"},{"id":"D1","dir":"down","num":1,"clue":"Printable puzzle like this one (9)","cells":[[0,3],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3]],"a":"Q1JPU1NXT1JE"},{"id":"D3","dir":"down","num":3,"clue":"One of the things I love about you (9)","cells":[[1,5],[2,5],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5]],"a":"QkVBVVRJRlVM"},{"id":"D4","dir":"down","num":4,"clue":"Fruit that's 'on top' in the juicy Strands puzzle (10)","cells":[[1,13],[2,13],[3,13],[4,13],[5,13],[6,13],[7,13],[8,13],[9,13],[10,13]],"a":"V0FURVJNRUxPTg=="},{"id":"D7","dir":"down","num":7,"clue":"Her drink that's '2/3 Diet Coke, 1/3 Coke,' but actually this (4,4)","cells":[[7,10],[8,10],[9,10],[10,10],[11,10],[12,10],[13,10],[14,10]],"a":"Q09LRVpFUk8="},{"id":"D9","dir":"down","num":9,"clue":"Sweet-tooth dessert, promised with vanilla ice cream (4,4)","cells":[[8,7],[9,7],[10,7],[11,7],[12,7],[13,7],[14,7],[15,7]],"a":"TEFWQUNBS0U="},{"id":"D10","dir":"down","num":10,"clue":"Word game this puzzle borrows its theme words from (7)","cells":[[10,1],[11,1],[12,1],[13,1],[14,1],[15,1],[16,1]],"a":"U1RSQU5EUw=="},{"id":"D11","dir":"down","num":11,"clue":"Name signed on every Strands win screen (4)","cells":[[10,4],[11,4],[12,4],[13,4]],"a":"RklOTg=="},{"id":"D13","dir":"down","num":13,"clue":"Burger chain in 'Order like Melina' (2,1,3)","cells":[[10,12],[11,12],[12,12],[13,12],[14,12],[15,12]],"a":"SU5OT1VU"}],"storageKey":"cw:QWxsIEFib3V0IE1lbGluYXxT"};
(function () {
  const $ = (id) => document.getElementById(id);
  const boardEl = $("board");
  const kb = $("kb");
  const rows = P.rows, cols = P.cols;
  const words = P.words;
  const open = P.open;
  const nums = P.nums;
  const fill = Array.from({ length: rows }, () => Array(cols).fill(""));
  const wrong = Array.from({ length: rows }, () => Array(cols).fill(false));
  const cellEls = {};
  let cur = null; // { r, c, word }
  let celebrated = false;

  const decode = (w) => atob(w.a).toUpperCase();

  function wordsAt(r, c) {
    return words.filter((w) => w.cells.some(([rr, cc]) => rr === r && cc === c));
  }
  function wordIndex(w, r, c) {
    return w.cells.findIndex(([rr, cc]) => rr === r && cc === c);
  }
  function keyOf(r, c) { return r + "," + c; }

  function load() {
    try {
      const raw = localStorage.getItem(P.storageKey);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data && data.cells) {
        for (const [k, v] of Object.entries(data.cells)) {
          const [r, c] = k.split(",").map(Number);
          if (open[r] && open[r][c] && typeof v === "string") fill[r][c] = v.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 1);
        }
      }
    } catch (e) { /* private mode etc. */ }
  }
  function save() {
    try {
      const cells = {};
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (fill[r][c]) cells[keyOf(r, c)] = fill[r][c];
        }
      }
      localStorage.setItem(P.storageKey, JSON.stringify({ cells }));
    } catch (e) { /* ignore */ }
  }

  function isSolved() {
    for (const w of words) {
      const ans = decode(w);
      for (let i = 0; i < w.cells.length; i++) {
        const [r, c] = w.cells[i];
        if (fill[r][c] !== ans[i]) return false;
      }
    }
    return true;
  }
  function filledCount() {
    let n = 0, t = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!open[r][c]) continue;
        t++;
        if (fill[r][c]) n++;
      }
    }
    return [n, t];
  }
  function wordComplete(w) {
    return w.cells.every(([r, c]) => fill[r][c]);
  }

  function renderCell(r, c) {
    const el = cellEls[keyOf(r, c)];
    if (!el || !open[r][c]) return;
    el.classList.toggle("in-word", !!(cur && cur.word.cells.some(([rr, cc]) => rr === r && cc === c)));
    el.classList.toggle("selected", !!(cur && cur.r === r && cur.c === c));
    el.classList.toggle("wrong", wrong[r][c]);
    el.querySelector(".glyph").textContent = fill[r][c] || "";
  }
  function renderAll() {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) renderCell(r, c);
    }
    // clues
    document.querySelectorAll(".clues li").forEach((li) => {
      const w = words.find((x) => x.id === li.dataset.id);
      li.classList.toggle("active", !!(cur && cur.word.id === li.dataset.id));
      li.classList.toggle("filled", !!(w && wordComplete(w)));
    });
    const [n, t] = filledCount();
    const pg = $("progress");
    if (isSolved()) {
      pg.textContent = "Solved!";
      pg.classList.add("done");
    } else {
      pg.textContent = n + " / " + t;
      pg.classList.remove("done");
    }
    updateClueBar();
  }

  function updateClueBar() {
    const copy = $("clue-copy");
    const dirBtn = $("btn-dir");
    if (!cur) {
      copy.textContent = "Tap a square to begin.";
      dirBtn.textContent = "Across";
      return;
    }
    dirBtn.textContent = cur.word.dir === "across" ? "Across" : "Down";
    copy.innerHTML = "<b>" + cur.word.num + (cur.word.dir === "across" ? "A" : "D") + "</b> " + escapeHtml(cur.word.clue);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[ch]));
  }

  function placeKb() {
    if (!cur) return;
    const el = cellEls[keyOf(cur.r, cur.c)];
    if (!el) return;
    const rec = el.getBoundingClientRect();
    kb.style.left = rec.left + "px";
    kb.style.top = rec.top + "px";
    kb.style.width = Math.max(rec.width, 8) + "px";
    kb.style.height = Math.max(rec.height, 8) + "px";
  }
  function focusKb() {
    placeKb();
    try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); }
    try { kb.setSelectionRange(0, kb.value.length); } catch (e) {}
  }

  function selectCell(r, c, dir) {
    if (!open[r] || !open[r][c]) return;
    const here = wordsAt(r, c);
    if (!here.length) return;
    let w = dir ? here.find((x) => x.dir === dir) : null;
    if (!w) w = here[0];
    cur = { r, c, word: w };
    renderAll();
    placeKb();
    const el = cellEls[keyOf(r, c)];
    if (el) {
      const rec = el.getBoundingClientRect();
      const bar = $("clue-bar").getBoundingClientRect();
      if (rec.top < bar.bottom + 8 || rec.bottom > window.innerHeight - 8) {
        el.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      }
    }
  }

  function toggleDir() {
    if (!cur) return;
    const here = wordsAt(cur.r, cur.c);
    const other = here.find((w) => w.id !== cur.word.id);
    if (other) selectCell(cur.r, cur.c, other.dir);
    focusKb();
  }

  function typeLetter(ch) {
    if (!cur) return;
    ch = ch.toUpperCase();
    if (!/^[A-Z]$/.test(ch)) return;
    fill[cur.r][cur.c] = ch;
    wrong[cur.r][cur.c] = false;
    save();
    const idx = wordIndex(cur.word, cur.r, cur.c);
    if (idx < cur.word.cells.length - 1) {
      const [nr, nc] = cur.word.cells[idx + 1];
      selectCell(nr, nc, cur.word.dir);
    } else {
      // jump to next unfilled cell in this word, else next word
      const empty = cur.word.cells.find(([r, c]) => !fill[r][c]);
      if (empty) selectCell(empty[0], empty[1], cur.word.dir);
      else {
        renderAll();
        maybeWin();
      }
    }
    focusKb();
    maybeWin();
  }

  function backspace() {
    if (!cur) return;
    if (fill[cur.r][cur.c]) {
      fill[cur.r][cur.c] = "";
      wrong[cur.r][cur.c] = false;
      save();
      renderAll();
      focusKb();
      return;
    }
    const idx = wordIndex(cur.word, cur.r, cur.c);
    if (idx > 0) {
      const [nr, nc] = cur.word.cells[idx - 1];
      fill[nr][nc] = "";
      wrong[nr][nc] = false;
      save();
      selectCell(nr, nc, cur.word.dir);
    } else {
      renderAll();
    }
    focusKb();
  }

  function move(dr, dc) {
    if (!cur) return;
    if (dr === 0 && dc !== 0) {
      if (cur.word.dir !== "across") {
        const across = wordsAt(cur.r, cur.c).find((w) => w.dir === "across");
        if (across) { selectCell(cur.r, cur.c, "across"); focusKb(); return; }
      }
    }
    if (dc === 0 && dr !== 0) {
      if (cur.word.dir !== "down") {
        const down = wordsAt(cur.r, cur.c).find((w) => w.dir === "down");
        if (down) { selectCell(cur.r, cur.c, "down"); focusKb(); return; }
      }
    }
    let r = cur.r + dr, c = cur.c + dc;
    while (r >= 0 && r < rows && c >= 0 && c < cols) {
      if (open[r][c]) {
        const prefer = (dc !== 0) ? "across" : (dr !== 0) ? "down" : cur.word.dir;
        selectCell(r, c, prefer);
        focusKb();
        return;
      }
      r += dr; c += dc;
    }
    focusKb();
  }

  function maybeWin() {
    if (!isSolved()) return;
    renderAll();
    if (celebrated) return;
    celebrated = true;
    $("win").classList.add("show");
  }

  function check() {
    for (const w of words) {
      const ans = decode(w);
      for (let i = 0; i < w.cells.length; i++) {
        const [r, c] = w.cells[i];
        if (fill[r][c] && fill[r][c] !== ans[i]) wrong[r][c] = true;
        else if (fill[r][c] === ans[i]) wrong[r][c] = false;
      }
    }
    renderAll();
    maybeWin();
    focusKb();
  }

  function revealLetter() {
    if (!cur) return;
    const w = cur.word;
    const i = wordIndex(w, cur.r, cur.c);
    fill[cur.r][cur.c] = decode(w)[i];
    wrong[cur.r][cur.c] = false;
    save();
    renderAll();
    maybeWin();
    focusKb();
  }
  function revealWord() {
    if (!cur) return;
    const w = cur.word, ans = decode(w);
    w.cells.forEach(([r, c], i) => { fill[r][c] = ans[i]; wrong[r][c] = false; });
    save();
    renderAll();
    maybeWin();
    focusKb();
  }
  function revealPuzzle() {
    if (!confirm("Reveal the whole puzzle?")) return;
    for (const w of words) {
      const ans = decode(w);
      w.cells.forEach(([r, c], i) => { fill[r][c] = ans[i]; wrong[r][c] = false; });
    }
    save();
    renderAll();
    maybeWin();
  }
  function clearWord() {
    if (!cur) return;
    cur.word.cells.forEach(([r, c]) => { fill[r][c] = ""; wrong[r][c] = false; });
    save();
    renderAll();
    focusKb();
  }
  function clearPuzzle() {
    if (!confirm("Clear the whole puzzle?")) return;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) { fill[r][c] = ""; wrong[r][c] = false; }
    }
    celebrated = false;
    save();
    renderAll();
    focusKb();
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === "Backspace") { e.preventDefault(); backspace(); }
    else if (k === "ArrowLeft") { e.preventDefault(); move(0, -1); }
    else if (k === "ArrowRight") { e.preventDefault(); move(0, 1); }
    else if (k === "ArrowUp") { e.preventDefault(); move(-1, 0); }
    else if (k === "ArrowDown") { e.preventDefault(); move(1, 0); }
    else if (k === " " || k === "Enter") { e.preventDefault(); toggleDir(); }
    else if (k === "Tab") {
      e.preventDefault();
      const list = words.filter((w) => w.dir === (cur ? cur.word.dir : "across"));
      if (!list.length) return;
      const i = cur ? list.findIndex((w) => w.id === cur.word.id) : -1;
      const next = list[(i + (e.shiftKey ? list.length - 1 : 1)) % list.length];
      const empty = next.cells.find(([r, c]) => !fill[r][c]) || next.cells[0];
      selectCell(empty[0], empty[1], next.dir);
      focusKb();
    } else if (k.length === 1 && /[a-zA-Z]/.test(k)) {
      e.preventDefault();
      typeLetter(k);
    }
  }

  // Build board
  boardEl.style.setProperty("--rows", rows);
  boardEl.style.setProperty("--cols", cols);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const el = document.createElement("div");
      el.className = "cell" + (open[r][c] ? " open" : (P.black ? " open black" : ""));
      el.dataset.r = r;
      el.dataset.c = c;
      const nk = keyOf(r, c);
      if (nums[nk]) {
        const n = document.createElement("span");
        n.className = "num";
        n.textContent = nums[nk];
        el.appendChild(n);
      }
      const g = document.createElement("span");
      g.className = "glyph";
      el.appendChild(g);
      if (open[r][c]) {
        el.addEventListener("pointerdown", () => {
          // Focus inside the same user gesture so iOS/Android open the keyboard.
          try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); }
          const here = wordsAt(r, c);
          if (cur && cur.r === r && cur.c === c && here.length > 1) {
            toggleDir();
          } else {
            const prefer = cur && here.find((w) => w.dir === cur.word.dir);
            selectCell(r, c, (prefer || here[0]).dir);
            focusKb();
          }
        });
      }
      boardEl.appendChild(el);
      cellEls[nk] = el;
    }
  }

  // Draw each grid edge exactly once so crossings are not thicker.
  (function drawGridLines() {
    function isDrawn(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return false;
      return !!(open[r][c] || P.black);
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "grid-lines");
    svg.setAttribute("id", "grid-lines");
    svg.setAttribute("viewBox", "0 0 " + cols + " " + rows);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("aria-hidden", "true");
    const parts = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!isDrawn(r, c)) continue;
        parts.push("M" + c + " " + r + "h1");
        parts.push("M" + c + " " + r + "v1");
        if (!isDrawn(r + 1, c)) parts.push("M" + c + " " + (r + 1) + "h1");
        if (!isDrawn(r, c + 1)) parts.push("M" + (c + 1) + " " + r + "v1");
      }
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", parts.join(""));
    path.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(path);
    boardEl.appendChild(svg);
  })();

  // Clue lists
  const cluesRoot = $("clues");
  function makeList(title, dir) {
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.textContent = title;
    sec.appendChild(h);
    const ol = document.createElement("ol");
    words.filter((w) => w.dir === dir).forEach((w) => {
      const li = document.createElement("li");
      li.dataset.id = w.id;
      li.innerHTML = "<span class=\"n\">" + w.num + "</span><span class=\"t\"></span>";
      li.querySelector(".t").textContent = w.clue;
      li.addEventListener("click", () => {
        const empty = w.cells.find(([r, c]) => !fill[r][c]) || w.cells[0];
        selectCell(empty[0], empty[1], w.dir);
        focusKb();
      });
      ol.appendChild(li);
    });
    sec.appendChild(ol);
    cluesRoot.appendChild(sec);
  }
  makeList("Across", "across");
  makeList("Down", "down");

  $("title").textContent = P.title;
  $("subtitle").textContent = P.subtitle || "";
  $("subtitle").style.display = P.subtitle ? "" : "none";
  $("win-msg").textContent = P.subtitle ? P.subtitle : "Every word in its place.";

  load();
  renderAll();
  // Start on the first across clue
  if (words.length) {
    const first = words.find((w) => w.dir === "across") || words[0];
    selectCell(first.cells[0][0], first.cells[0][1], first.dir);
  }

  kb.addEventListener("keydown", onKey);
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (e.target === kb) return;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    onKey(e);
  });
  kb.addEventListener("input", () => {
    const v = (kb.value || "").toUpperCase().replace(/[^A-Z]/g, "");
    kb.value = "";
    if (v) typeLetter(v.slice(-1));
  });
  kb.addEventListener("compositionend", () => {
    const v = (kb.value || "").toUpperCase().replace(/[^A-Z]/g, "");
    kb.value = "";
    if (v) typeLetter(v.slice(-1));
  });

  $("btn-dir").addEventListener("click", (e) => { e.preventDefault(); toggleDir(); });
  $("btn-check").addEventListener("click", check);
  $("btn-reveal-letter").addEventListener("click", () => { closeMenus(); revealLetter(); });
  $("btn-reveal-word").addEventListener("click", () => { closeMenus(); revealWord(); });
  $("btn-reveal-puzzle").addEventListener("click", () => { closeMenus(); revealPuzzle(); });
  $("btn-clear-word").addEventListener("click", () => { closeMenus(); clearWord(); });
  $("btn-clear-puzzle").addEventListener("click", () => { closeMenus(); clearPuzzle(); });
  $("btn-print").addEventListener("click", () => window.print());
  $("win-close").addEventListener("click", () => $("win").classList.remove("show"));
  $("win").addEventListener("click", (e) => { if (e.target.id === "win") $("win").classList.remove("show"); });

  function closeMenus() {
    document.querySelectorAll("details.menu").forEach((d) => { d.open = false; });
  }
  document.addEventListener("click", (e) => {
    document.querySelectorAll("details.menu").forEach((d) => {
      if (!d.contains(e.target)) d.open = false;
    });
  });
  window.addEventListener("resize", placeKb);
  window.addEventListener("scroll", placeKb, { passive: true });

  // If a previously saved puzzle is already complete, mark it solved quietly
  if (isSolved()) {
    celebrated = true;
    $("progress").textContent = "Solved!";
    $("progress").classList.add("done");
  }
})();
</script>
</body>
</html>
